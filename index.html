<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A2238">
  <meta name="description" content="Dawnside Academy — your online school, beautifully organized.">
  <title>Dawnside Academy | School CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --ink: #1A2238;
      --muted: #656b79;
      --line: #e4e0d8;
      --purple: #4D3EEB;
      --purple-dark: #392bc9;
      --surface: #F7F5F0;
      --canvas: #F7F5F0;
      --green: #2B2D2F;
      --shadow: 0 6px 24px rgba(26, 34, 56, .08);
      --orange: #FF6B35;
      --navy: #1A2238;
      --charcoal: #2B2D2F;
      --cream: #F7F5F0;
    }
    body { background: var(--cream); color: var(--charcoal); }
    .sidebar { background: var(--navy); color: var(--cream); border-color: var(--charcoal); }
    .sidebar .brand, .sidebar .workspace, .sidebar .nav-item, .sidebar .nav-icon,
    .sidebar .profile, .sidebar .help-card, .sidebar .help-card b { color: var(--cream); }
    .sidebar .brand-copy small, .sidebar .workspace small, .sidebar .nav-label,
    .sidebar .profile-copy small, .sidebar .help-card p { color: #c4c7d0; }
    .sidebar .workspace { border-color: #3a4155; }
    .workspace-dot, .brand-mark { background: var(--purple); }
    .nav-item:hover { background: #2B2D2F; color: var(--cream); }
    .nav-item.active { background: var(--purple); color: #fff; }
    .nav-item.active .nav-icon { color: #fff; }
    .help-card { background: #2B2D2F; border-color: #45484a; }
    .help-spark { background: var(--orange); color: var(--navy); }
    .help-link { color: #ff9a72; }
    .profile { background: transparent; border-color: #3a4155; }
    .topbar { background: rgba(247,245,240,.94); border-color: var(--line); }
    .page-content { background: var(--cream); }
    .page-heading h1, .metric-value, .student-name, .course-card h2 { color: var(--navy); }
    .metric-card, .panel, .student-stats, .stat-mini, .course-card,
    .table-panel, .modal { background: var(--cream); border-color: var(--line); }
    .button-primary, .button.button-primary, .button-primary:hover { background: var(--purple); border-color: var(--purple); }
    .button-primary:hover, .button.button-primary:hover { background: var(--purple-dark); border-color: var(--purple-dark); }
    .button:not(.button-primary):hover { border-color: var(--purple); color: var(--purple); }
    .icon-orange, .orange-spark { background: #ffeadf; color: var(--orange); }
    .icon-violet, .course-icon.lilac, .category-pill { background: #e9e6ff; color: var(--purple); }
    .trend, .positive { color: var(--orange); }
    .chart-line { stroke: var(--purple); }
    .chart-point { stroke: var(--orange); }
    .filter-tab.selected, .text-link, .modal-kicker { color: var(--purple); }
    .filter-tab.selected:after { background: var(--purple); }
    .progress-track i { background: var(--orange); }
    .status-active { background: #e9e6ff; color: var(--navy); }
    .status-risk { background: #ffeadf; color: #9c3d1c; }
    .avatar-purple { background: #e9e6ff; color: var(--purple); }
    .unread-dot, .notification-button i { background: var(--orange); }
    .modal-backdrop { background: rgba(26,34,56,.72); }
    .modal input:focus, .modal select:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(77,62,235,.16); }
    @media (max-width: 760px) {
      .sidebar { background: var(--navy); }
      .mobile-menu { color: var(--navy); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="Dawnside Academy home">
        <span class="brand-mark"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 3 32 11v14L18 33 4 25V11L18 3Z"/><path d="m11 21 5-10 9 14M14 20h10"/></svg></span>
        <span class="brand-copy"><strong>dawnside</strong><small>ACADEMY</small></span>
      </a>
      <div class="workspace"><span class="workspace-dot"></span><span><b>Dawnside Academy</b><small>School workspace</small></span><span class="chevron">⌄</span></div>
      <div class="nav-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="#dashboard" data-page="dashboard" class="nav-item active"><span class="nav-icon">▦</span>Overview</a>
        <a href="#students" data-page="students" class="nav-item"><span class="nav-icon">♙</span>Students <span class="nav-count" id="student-count">5</span></a>
        <a href="#courses" data-page="courses" class="nav-item"><span class="nav-icon">▤</span>Courses</a>
        <a href="#messages" data-page="messages" class="nav-item"><span class="nav-icon">▱</span>Messages<span class="unread-dot"></span></a>
        <a href="#analytics" data-page="analytics" class="nav-item"><span class="nav-icon">▥</span>Analytics</a>
      </nav>
      <div class="nav-label tools-label">MANAGE</div>
      <nav class="main-nav" aria-label="Management navigation">
        <a href="#calendar" data-page="calendar" class="nav-item"><span class="nav-icon">▦</span>Calendar</a>
        <a href="#settings" data-page="settings" class="nav-item"><span class="nav-icon">⚙</span>Settings</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-spark">✦</div><b>Need a hand?</b><p>Our team is here to help you grow your school.</p><button class="help-link" data-action="help">Visit help center <span>→</span></button></div>
        <button class="profile" data-action="profile"><span class="avatar avatar-purple">AM</span><span class="profile-copy"><b>Alex Morgan</b><small>School administrator</small></span><span class="profile-more">···</span></button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" aria-label="Open menu" data-action="menu">☰</button>
        <div class="breadcrumbs"><span>Workspace</span><span class="crumb-slash">/</span><b id="crumb-current">Overview</b></div>
        <div class="topbar-actions">
          <label class="global-search"><span>⌕</span><input id="global-search" type="search" placeholder="Search anything..." aria-label="Search anything"><kbd>⌘ K</kbd></label>
          <button class="icon-button" aria-label="Help" data-action="help">?<span class="help-ring"></span></button>
          <button class="icon-button notification-button" aria-label="Notifications" data-action="notifications">♧<i></i></button>
          <span class="top-divider"></span><span class="avatar avatar-purple top-avatar">AM</span>
        </div>
      </header>
      <div id="content" class="page-content" tabindex="-1"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
